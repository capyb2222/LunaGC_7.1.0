syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "GachaInfoOuterClass";

import "GachaUpInfo.proto";

message GachaInfo {
	string gacha_preview_prefab_path = 10;
	uint32 ten_cost_item_id = 5;
	uint32 gacha_type = 2;
	uint32 begin_time = 6;
	uint32 schedule_id = 1;
	uint32 left_gacha_times = 13;
	uint32 ten_cost_item_num = 4;
	uint32 gacha_times_limit = 14;
	uint32 cost_item_id = 8;
	string gacha_record_url = 7;
	uint32 cost_item_num = 12;
	string gacha_prob_url = 9;
	string gacha_prefab_path = 15;
	uint32 end_time = 3;
	uint32 gacha_sort_id = 11;
	repeated uint32 display_chronicle_5_item_list = 1643;
	bool HMOJLEMLHDK = 50011;
	repeated uint32 display_up4_item_list = 1440;
	bool is_new_wish = 410;
	repeated uint32 display_up5_item_list = 1343;
	string gacha_record_url_oversea = 600;
	string gacha_prob_url_oversea = 425;
	string title_textmap = 2032;
	uint32 wish_max_progress = 586;
	uint32 wish_progress = 590;
	uint32 cur_schedule_daily_gacha_times = 1659;
	uint32 wish_item_id = 1272;
	repeated GachaUpInfo gacha_up_info_list = 1931;
}
