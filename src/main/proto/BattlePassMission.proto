syntax = "proto3";

option java_package = "emu.grasscutter.net.proto";
option java_outer_classname = "BattlePassMissionOuterClass";

message BattlePassMission {
	enum MissionStatus {
		MISSION_INVALID = 0;
		MISSION_UNFINISHED = 1;
		MISSION_FINISHED = 2;
		MISSION_POINT_TAKEN = 3;
	}
	uint32 cur_progress = 10;
	uint32 reward_battle_pass_point = 4;
	uint32 mission_id = 8;
	MissionStatus mission_status = 11;
	uint32 mission_type = 7;
	uint32 total_progress = 15;
}
